services:
  - type: web
    name: postly-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DB_CONN_MAX_AGE
        value: "600"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        sync: false # Neon PostgreSQL pooled connection string: postgresql://[user]:[password]@[endpoint]-pooler.neon.tech/neondb?sslmode=require
      - key: CELERY_BROKER_URL
        sync: false # Upstash Redis connection string: rediss://default:[password]@[endpoint].upstash.io:6379
      - key: REDIS_URL
        sync: false # Same Upstash Redis connection string for Django cache
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

